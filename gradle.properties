org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ===== 目标平台（首版只出 26.3，与 HUB 客户端 RO26.3 对齐；铺其它版本时复制本工程的版本化子工程） =====
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Fabric API：与服务端 carpet-Neko-Addition 同一套 networking 抽象，版本必须对齐 26.3
fabric_version=0.161.0+26.3

# ===== 拼音匹配 =====
# jpinyin（Apache-2.0）：纯 Java，客户端建「中文名 / 全拼 / 首字母」索引用。
# include = fabric Jar-in-Jar 打包进产物 jar。
# （首选 TinyPinyin 在 Maven Central 没有可用坐标，实测 404；jpinyin 是 Central 上的
#   Apache-2.0 替代，且 getShortPinyin 直接给首字母。）
jpinyin_version=1.1.8

# ===== Mod 元信息 =====
mod_version=0.1.0
maven_group=neko
archives_base_name=voidwarehouse-search
