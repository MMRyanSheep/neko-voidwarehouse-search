plugins {
    // 26.x 起用这个「不 remap」的 Loom 插件；1.21.x 及以前才是 fabric-loom-remap
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.x 不混淆，所有依赖都用普通 implementation，不需要 modImplementation
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 拼音匹配：jpinyin（Apache-2.0）。include = Jar-in-Jar 打进产物；
    // implementation 先声明再 include，让它同时进编译与测试类路径。
    implementation "com.github.stuxuhai:jpinyin:${project.jpinyin_version}"
    include "com.github.stuxuhai:jpinyin:${project.jpinyin_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('build') {
    doLast {
        def f = tasks.named('jar').get().archiveFile.get().asFile
        if (f.exists()) {
            println ''
            println '============================================================'
            println "  JAR : ${f.absolutePath}"
            println "  SIZE: ${f.length()} bytes"
            println '============================================================'
        } else {
            println "  [WARN] jar not found: ${f.absolutePath}"
        }
    }
}

// 产物复制到工作区 MC/dist/（独立仓库没有 dist 任务约定的先例，这里自建一条，与服务端交付习惯对齐）
tasks.register('dist', Copy) {
    group = 'build'
    description = 'Copies the built mod jar into the workspace dist/ directory'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('../deliver/voidwarehouse-search')
    doLast {
        println "  dist -> ${rootProject.layout.projectDirectory.dir('../deliver/voidwarehouse-search').asFile.absolutePath}"
    }
}
